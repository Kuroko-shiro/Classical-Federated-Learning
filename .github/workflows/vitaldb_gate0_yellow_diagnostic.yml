name: VitalDB Gate0 Yellow Capacity Diagnostic

on:
  push:
    branches:
      - agent/vitaldb-stage-ab
    paths:
      - 'vitaldb_stage_i/**'
      - '.github/workflows/vitaldb_gate0_yellow_diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '33889175977'

jobs:
  capacity-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [101, 202, 303]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download canonical Gate0 dataset from completed source run
        uses: actions/download-artifact@v4
        with:
          name: vitaldb-gate0-dataset
          path: dataset
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install CPU training dependencies
        run: |
          python -m pip install numpy pandas pyarrow scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train exact-capacity same-sensor controls
        run: |
          for condition in ecg_dual pleth_dual; do
            python vitaldb_stage_i/train_capacity_control.py \
              --data-dir dataset \
              --out controls/${condition}_seed${{ matrix.seed }} \
              --condition ${condition} \
              --seed ${{ matrix.seed }} \
              --epochs 12 \
              --batch-size 256 \
              --lr 1e-3 \
              --patience 3
          done
      - name: Upload capacity-control seed results
        uses: actions/upload-artifact@v4
        with:
          name: vitaldb-gate0-capacity-seed-${{ matrix.seed }}
          path: controls
          retention-days: 30

  aggregate-diagnostic:
    needs: capacity-controls
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download capacity-control results
        uses: actions/download-artifact@v4
        with:
          pattern: vitaldb-gate0-capacity-seed-*
          path: controls
          merge-multiple: true
      - name: Download original three-seed Gate0 results
        uses: actions/download-artifact@v4
        with:
          pattern: vitaldb-gate0-seed-*
          path: original
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download canonical Gate0 dataset for subject-clustered bootstrap
        uses: actions/download-artifact@v4
        with:
          name: vitaldb-gate0-dataset
          path: dataset
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run integrity and capacity diagnostic
        run: |
          python -m pip install numpy pandas pyarrow scikit-learn
          python vitaldb_stage_i/aggregate_capacity_diagnostic.py \
            --original-root original \
            --control-root controls \
            --dataset-dir dataset \
            --out diagnostic \
            --n-boot 1000
      - name: Show diagnostic report
        run: cat diagnostic/vitaldb_gate0_capacity_report.md
      - name: Upload Yellow diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: vitaldb-gate0-yellow-capacity-diagnostic
          path: diagnostic
          retention-days: 30
