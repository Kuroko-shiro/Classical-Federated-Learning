name: VitalDB Stage C MAP Label Audit

on:
  push:
    branches:
      - agent/vitaldb-stage-ab
    paths:
      - 'vitaldb_stage_c/**'
      - '.github/workflows/vitaldb_stage_c.yml'
  workflow_dispatch:

jobs:
  label-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r vitaldb_stage_c/requirements.txt

      - name: Run MAP label audit
        run: |
          python vitaldb_stage_c/stage_c_map_label_audit.py \
            --out artifacts/vitaldb_stage_c \
            --workers 8

      - name: Show summary
        if: always()
        run: |
          cat artifacts/vitaldb_stage_c/vitaldb_stage_c_report.md 2>/dev/null || true
          cat artifacts/vitaldb_stage_c/vitaldb_cohort_summary.json 2>/dev/null || true

      - name: Upload label audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitaldb-stage-c-label-audit
          path: artifacts/vitaldb_stage_c
          if-no-files-found: warn
