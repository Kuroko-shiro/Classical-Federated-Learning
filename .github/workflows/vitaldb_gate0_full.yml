name: VitalDB Full Download-QC-Gate0

on:
  push:
    branches:
      - agent/vitaldb-stage-ab
    paths:
      - 'vitaldb_stage_f/**'
      - 'vitaldb_stage_g/**'
      - 'vitaldb_stage_h/**'
      - '.github/workflows/vitaldb_gate0_full.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install extraction dependencies
        run: python -m pip install -r vitaldb_stage_g/requirements.txt
      - name: Rebuild canonical packed MAP manifest
        run: |
          python vitaldb_stage_f/build_packed_manifest.py \
            --out work/manifest \
            --workers 6 \
            --seed 20260904
      - name: Enforce pre-signal scale gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('work/manifest/vitaldb_packed_manifest_summary.json'))
          print(d)
          if d['window_scale_gate'] != 'WINDOW_SCALE_GO':
              raise SystemExit('STOP: packed manifest did not meet WINDOW_SCALE_GO')
          PY
      - name: Download and extract ECG/PLETH windows at 125 Hz
        run: |
          python vitaldb_stage_g/extract_windows.py \
            --manifest work/manifest/vitaldb_window_manifest.parquet \
            --out work/dataset \
            --workers 8
      - name: Enforce final signal-QC scale gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('work/dataset/vitaldb_signal_qc_summary.json'))
          print(d)
          if d['scale_gate'] != 'SIGNAL_QC_SCALE_GO':
              raise SystemExit('STOP: ECG/PLETH QC did not meet SIGNAL_QC_SCALE_GO')
          PY
      - name: Save reproducibility metadata
        run: |
          cp work/manifest/vitaldb_packed_manifest_summary.json work/dataset/
          cp work/manifest/vitaldb_subject_split.csv work/dataset/
          python -m pip freeze > work/dataset/pip_freeze_extraction.txt
          git rev-parse HEAD > work/dataset/git_commit.txt
      - name: Upload processed Gate0 dataset
        uses: actions/upload-artifact@v4
        with:
          name: vitaldb-gate0-dataset
          path: work/dataset
          compression-level: 1
          retention-days: 30
      - name: Upload small QC summary
        uses: actions/upload-artifact@v4
        with:
          name: vitaldb-gate0-qc-summary
          path: |
            work/dataset/vitaldb_signal_qc_summary.json
            work/dataset/vitaldb_signal_case_load_audit.csv
            work/dataset/vitaldb_signal_qc_all.parquet
            work/dataset/vitaldb_packed_manifest_summary.json
            work/dataset/vitaldb_subject_split.csv
          retention-days: 30

  train:
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [101, 202, 303]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download processed dataset
        uses: actions/download-artifact@v4
        with:
          name: vitaldb-gate0-dataset
          path: dataset
      - name: Install CPU training dependencies
        run: |
          python -m pip install numpy pandas pyarrow scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train matched ECG, PLETH and fusion models
        run: |
          for condition in ecg_only pleth_only ecg_pleth; do
            python vitaldb_stage_h/train_gate0.py \
              --data-dir dataset \
              --out results/${condition}_seed${{ matrix.seed }} \
              --condition ${condition} \
              --seed ${{ matrix.seed }} \
              --epochs 12 \
              --batch-size 256 \
              --lr 1e-3 \
              --patience 3
          done
          python -m pip freeze > results/pip_freeze_training.txt
      - name: Upload seed metrics
        uses: actions/upload-artifact@v4
        with:
          name: vitaldb-gate0-seed-${{ matrix.seed }}
          path: results
          retention-days: 30

  aggregate:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all seed metrics
        uses: actions/download-artifact@v4
        with:
          pattern: vitaldb-gate0-seed-*
          path: metrics
          merge-multiple: true
      - name: Download QC summary
        uses: actions/download-artifact@v4
        with:
          name: vitaldb-gate0-qc-summary
          path: qc
      - name: Aggregate Gate0
        run: |
          python -m pip install numpy pandas
          python vitaldb_stage_h/aggregate_gate0.py \
            --metrics-root metrics \
            --qc-summary qc/vitaldb_signal_qc_summary.json \
            --out gate0
      - name: Show Gate0 report
        run: cat gate0/vitaldb_gate0_report.md
      - name: Upload final Gate0 report
        uses: actions/upload-artifact@v4
        with:
          name: vitaldb-gate0-final-report
          path: gate0
          retention-days: 30
